name: Sync Blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # 매일 UTC 00:00 (한국시간 09:00)
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Velog → D1 동기화
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.WORKER_URL }}/api/sync" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json")
          cat /tmp/response.json
          if [ "$STATUS" != "200" ]; then
            echo "동기화 실패: HTTP $STATUS"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # sitemap-pages.xml 의 lastmod 를 git 이력에서 뽑기 위해 전체 이력 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 블로그 정적 페이지 · RSS · 사이트맵 빌드
        run: |
          cd scripts
          npm install --no-audit --no-fund
          node build-blog.mjs

      - name: 변경 사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts blog/index.html blog/sitemap.xml blog/rss.xml sitemap-pages.xml
          if git diff --cached --quiet; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(blog): 정적 페이지 · RSS · 사이트맵 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 사이트맵이 바뀌었을 때 Bing · 네이버 · Yandex 에 IndexNow 로 갱신 알림 (구글은 ping 미지원 → 사이트맵 자동 재크롤)
      - name: IndexNow 갱신 알림
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          KEY="6a0260f9a2c941fb888d67a53dbe4164"
          URLS=$(cat sitemap-pages.xml blog/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | sort -u)
          echo "$URLS" | jq -R . | jq -s --arg key "$KEY" '{
            host: "njw.kro.kr", key: $key,
            keyLocation: ("https://njw.kro.kr/" + $key + ".txt"),
            urlList: .
          }' > /tmp/indexnow.json
          echo "$(echo "$URLS" | wc -l)개 URL 전송"
          # push 직후엔 GitHub Pages 재배포 중이라 키 파일이 잠깐 안 읽힐 수 있음(→ 403). 배포가 끝나 새 사이트맵이 실제로 서빙될 때까지 최대 5분 대기
          for i in $(seq 1 30); do
            if curl -sf "https://njw.kro.kr/sitemap-pages.xml" | cmp -s - sitemap-pages.xml \
               && [ "$(curl -s https://njw.kro.kr/$KEY.txt)" = "$KEY" ]; then
              echo "배포 확인 (${i}0초)"; break
            fi
            sleep 10
          done
          # 한 곳에만 보내면 그쪽이 거부할 때 나머지에도 전달이 안 되므로 각 엔진에 직접 전송
          # (Bing 은 이 사이트의 키 검증을 403 으로 거부 중 — 원인 미확인, 경고만 남김)
          for EP in https://searchadvisor.naver.com/indexnow https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
            STATUS=$(curl -s -o /tmp/indexnow.out -w "%{http_code}" \
              -X POST "$EP" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @/tmp/indexnow.json)
            echo "IndexNow $EP → HTTP $STATUS $(head -c 150 /tmp/indexnow.out | tr -d '\n')"
            case "$STATUS" in 200|202) ;; *) echo "::warning::IndexNow $EP 응답 $STATUS";; esac
          done
          # 사이트맵 커밋은 이미 끝났으므로 전송 실패로 워크플로우를 실패시키지는 않음
          exit 0
